plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.electricbillestimator'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.electricbillestimator"
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName "2.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // A fixed key so every APK built by GitHub Actions has the same signature and can be updated in place.
    // It is intentionally public (sideloading only) - do NOT use it to publish on Google Play.
    signingConfigs {
        release {
            storeFile file("ebe-sideload.jks")
            storePassword "ebe-sideload"
            keyAlias "ebe"
            keyPassword "ebe-sideload"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lint {
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}